<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DevOps Pipeline Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #1abc9c, #3498db);
      color: #fff;
    }
    header { background: rgba(0,0,0,0.6); padding: 20px; text-align: center; }
    nav { background: rgba(0,0,0,0.4); padding: 10px; text-align: center; }
    nav a { color: #fff; margin: 0 15px; text-decoration: none; font-weight: bold; }
    .container { display: flex; flex-wrap: wrap; justify-content: center; margin: 20px; }
    .stage {
      background: #fff; color: #2c3e50; margin: 15px; padding: 20px;
      border-radius: 10px; width: 250px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    button {
      padding: 8px 15px; margin-top: 10px; border: none; border-radius: 5px;
      background: #3498db; color: white; font-weight: bold; cursor: pointer;
    }
    button:hover { background: #2980b9; }
    #log {
      margin: 20px auto; padding: 15px; background: #fff; color: #2c3e50;
      border-radius: 10px; max-width: 700px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .success { color: green; } .error { color: red; }
    .progress-bar { height: 15px; background: #ccc; border-radius: 5px; margin-top: 10px; overflow: hidden; }
    .progress { height: 100%; width: 0%; background: #27ae60; transition: width 1s; }
  </style>
</head>
<body>
  <header>
    <h1>DevOps Continuous Testing Framework</h1>
    <p>Conditional CI/CD Pipeline Execution</p>
  </header>

  <nav>
    <a href="#pipeline">Pipeline</a>
    <a href="#log">Logs</a>
  </nav>

  <!-- Pipeline Stages -->
  <div class="container" id="pipeline">
    <div class="stage"><h3>1. Developer Commit</h3><button onclick="runPipeline()">Run Pipeline</button></div>
  </div>

  <!-- Log + Progress -->
  <div id="log">
    <h3>Pipeline Log</h3>
    <ul id="logList"></ul>
    <div class="progress-bar"><div id="progress" class="progress"></div></div>
  </div>

  <script>
    let progress = 0;

    function logMessage(message, success) {
      const logList = document.getElementById("logList");
      const li = document.createElement("li");
      li.textContent = message;
      li.className = success ? "success" : "error";
      logList.appendChild(li);

      if(success) {
        progress += 20;
        if(progress > 100) progress = 100;
        document.getElementById("progress").style.width = progress + "%";
      }
    }

    function runPipeline() {
      // Step 1: Commit
      logMessage("Code committed to GitHub ✅", true);

      // Step 2: GitHub Actions
      logMessage("GitHub Actions triggered ✅", true);

      // Step 3: Jenkins Build
      let jenkinsSuccess = true; // change to false to simulate failure
      if(jenkinsSuccess) {
        logMessage("Jenkins build successful ✅", true);

        // Step 4: Testing
        logMessage("All test cases passed ✅", true);

        // Step 5: Deployment
        logMessage("Deployment to Kubernetes cluster ✅", true);

        // Step 6: Monitoring
        logMessage("Prometheus & Grafana monitoring active ✅", true);
      } else {
        logMessage("Jenkins build failed ❌ → Pipeline stopped!", false);
      }
    }
  </script>
</body>
</html>
